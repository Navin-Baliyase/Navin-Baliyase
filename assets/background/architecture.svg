  <g stroke="#676d78" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M190,108 L228,108"/>
    <path d="M400,108 L438,108"/>
    <path d="M630,108 L668,108"/>
    <path d="M535,136 L535,198"/>
