    <text x="115" y="113" text-anchor="middle">Webcam</text>

    <rect x="230" y="80" width="170" height="56" rx="8" fill="#1b1e24" stroke="#3d424e"/>
    <text x="315" y="106" text-anchor="middle">Capture</text>
    <text x="315" y="123" text-anchor="middle" font-size="11" fill="#9ba1ac">Web Worker</text>

    <rect x="440" y="80" width="190" height="56" rx="8" fill="#1b1e24" stroke="#e8a63d" stroke-width="1.5"/>
    <text x="535" y="106" text-anchor="middle">Segmentation</text>
    <text x="535" y="123" text-anchor="middle" font-size="11" fill="#9ba1ac">MediaPipe · 8-14ms</text>

    <rect x="670" y="80" width="90" height="56" rx="8" fill="#1b1e24" stroke="#3d424e"/>
    <text x="715" y="113" text-anchor="middle" font-size="13">Mask</text>

    <rect x="230" y="200" width="170" height="56" rx="8" fill="#1b1e24" stroke="#3d424e"/>
    <text x="315" y="226" text-anchor="middle">Compositor</text>
    <text x="315" y="243" text-anchor="middle" font-size="11" fill="#9ba1ac">Three.js / WebGL2</text>

    <rect x="440" y="200" width="190" height="56" rx="8" fill="#1b1e24" stroke="#3d424e"/>
    <text x="535" y="226" text-anchor="middle">Quality Controller</text>
    <text x="535" y="243" text-anchor="middle" font-size="11" fill="#9ba1ac">adaptive, per-frame</text>

    <rect x="230" y="320" width="170" height="56" rx="8" fill="#1b1e24" stroke="#3d424e"/>
    <text x="315" y="346" text-anchor="middle">Native Bridge</text>
