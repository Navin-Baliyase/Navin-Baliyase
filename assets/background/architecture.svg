<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#0e0f13"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#676d78"/>
    </marker>
  </defs>
  <text x="40" y="46" font-family="JetBrains Mono, monospace" font-size="11" fill="#e8a63d" letter-spacing="1.5">FRAME PIPELINE</text>

  <!-- boxes -->
  <g font-family="Source Sans 3, sans-serif" font-size="15" fill="#ecedef">
