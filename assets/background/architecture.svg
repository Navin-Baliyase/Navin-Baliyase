    <text x="535" y="346" text-anchor="middle">Virtual Camera</text>
    <text x="535" y="363" text-anchor="middle" font-size="11" fill="#9ba1ac">v4l2loopback (Linux)</text>

    <rect x="670" y="320" width="90" height="56" rx="8" fill="#1b1e24" stroke="#3d424e"/>
    <text x="715" y="353" text-anchor="middle" font-size="13">Meet/Zoom</text>
